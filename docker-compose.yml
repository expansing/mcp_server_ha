version: "3.8"

services:
  ha-mcp:
    build: .
    container_name: ha-mcp
    restart: unless-stopped
    environment:
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=${HA_TOKEN}
      - HA_VERIFY_SSL=false
    volumes:
      - ./config:/config
    networks:
      - homeassistant

networks:
  homeassistant:
    external: true
