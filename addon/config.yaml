name: HA MCP Server
version: 0.1.0
slug: ha-mcp
description: AI sysadmin for Home Assistant - analysis platform exposing diagnostics, automation health, and configuration search via MCP
url: https://github.com/expansing/mcp_server_ha
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: MCP Server HTTP port
options:
  ha_url: http://supervisor/core
  ha_token: ""
  ha_verify_ssl: false
schema:
  ha_url: str
  ha_token: str
  ha_verify_ssl: bool
environment:
  HA_URL: /data/options.json
  HA_TOKEN: /data/options.json
  HA_VERIFY_SSL: /data/options.json
